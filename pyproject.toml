[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-llm"
version = "0.1.0"
description = "Model-independent local inference for compatible open-source causal language models"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
vllm = [
    "vllm>=0.28.0",
]

[project.scripts]
sparse-llm = "sparse_llm.cli:cli"

[tool.pytest.ini_options]
testpaths = ["sparse_llm/tests"]
addopts = "-ra"
